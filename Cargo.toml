[package]
name = "chat-app"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
colored = "2.0"
chrono = "0.4"
postgres = "0.19"
tokio-postgres = "0.7"

# NEW: Error Handling
thiserror = "2.0"
anyhow = "1.0"

# NEW: Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# NEW: System Information (for monitoring later)
sysinfo = "0.30"
hostname = "0.3"

# NEW: Retry Logic
tokio-retry = "0.3"

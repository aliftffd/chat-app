version: '3.8'

services:
  chat-server:
    build: .
    container_name: chat-server
    ports:
      - "8080:8080"
    volumes:
      # Persist SQLite database across container restarts
      - chat-data:/data
    environment:
      - RUST_LOG=chat_app=info
      - XDG_DATA_HOME=/data
    networks:
      - chat-network
    restart: unless-stopped
    command: ["server", "--address", "0.0.0.0:8080"]

  # Optional: Example client (run with: docker-compose --profile client up)
  chat-client:
    build: .
    container_name: chat-client
    depends_on:
      - chat-server
    command: ["client", "--address", "chat-server:8080", "--auto-reconnect"]
    environment:
      - RUST_LOG=chat_app=info
    networks:
      - chat-network
    stdin_open: true
    tty: true
    profiles:
      - client

volumes:
  chat-data:
    driver: local

networks:
  chat-network:
    driver: bridge
